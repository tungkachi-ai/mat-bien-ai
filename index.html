<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mắt Biển AI đã chuyển địa chỉ</title>
<meta http-equiv="refresh" content="0; url=https://vonguyenbao.github.io/mat-bien-ai/">
<link rel="canonical" href="https://vonguyenbao.github.io/mat-bien-ai/">
<style>body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f8fb;color:#0f172a;margin:0;padding:40px 16px;text-align:center}a{color:#0e7490;font-weight:700}</style>
<script>
  // gỡ bản cài cũ (service worker, bộ nhớ đệm) ở địa chỉ cũ rồi chuyển sang địa chỉ mới, giữ phần #trang
  (async function () {
    try { if (navigator.serviceWorker) { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map((r) => r.unregister())); } } catch (e) {}
    try { if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map((k) => caches.delete(k))); } } catch (e) {}
    location.replace('https://vonguyenbao.github.io/mat-bien-ai/' + (location.hash || ''));
  })();
</script>
</head>
<body>
<p>Mắt Biển AI đã chuyển sang địa chỉ mới:</p>
<p><a href="https://vonguyenbao.github.io/mat-bien-ai/">vonguyenbao.github.io/mat-bien-ai</a></p>
<p style="color:#475569;font-size:14px">Nếu đã cài app ở địa chỉ cũ, hãy xoá biểu tượng cũ và cài lại từ địa chỉ mới.</p>
</body>
</html>
